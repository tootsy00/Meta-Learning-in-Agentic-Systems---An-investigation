[project]
name = "aas"
version = "0.0.1"
description = "Agentic Architecture Search: automated discovery of multi-agent topologies"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.2",
]

[project.optional-dependencies]
# Kept separate so the core schema/engine contracts stay importable without a
# model provider installed (search-space tooling and tests need neither).
providers = ["litellm>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
